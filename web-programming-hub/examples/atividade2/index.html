<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 - Gerenciador de Tarefas Interativo</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para ícones premium -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Container Principal do Gerenciador de Tarefas -->
    <main class="todo-container">
        
        <!-- Cabeçalho -->
        <header class="todo-header">
            <h1><i class="fa-solid fa-list-check"></i> Tarefas Práticas</h1>
            <p>Organize seus estudos acadêmicos de forma moderna</p>
        </header>

        <!-- Formulário para adicionar novas tarefas -->
        <form id="todo-form" class="todo-form">
            <input type="text" id="todo-input" placeholder="Nova tarefa para estudar..." required maxlength="60">
            <button type="submit" aria-label="Adicionar Tarefa">
                <i class="fa-solid fa-plus"></i>
            </button>
        </form>

        <!-- Painel de Filtros para alternar visibilidade de tarefas -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="pending">Pendentes</button>
            <button class="filter-btn" data-filter="completed">Concluídas</button>
        </div>

        <!-- Lista dinâmica onde os itens serão adicionados via JavaScript -->
        <ul id="todo-list" class="todo-list">
            <!-- Inserido dinamicamente pelo JavaScript -->
        </ul>

        <!-- Rodapé do painel: contagem de pendências e botão de reset -->
        <footer class="todo-footer">
            <span id="task-counter">0 pendentes</span>
            <button id="clear-completed" class="clear-btn">Limpar Concluídas</button>
        </footer>

    </main>

    <!-- Script de Aplicação -->
    <script src="app.js"></script>
</body>
</html>
