<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1 - Card de Perfil Profissional</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importando ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Elemento principal do Card de Perfil -->
    <article class="profile-card">
        
        <!-- Cabeçalho contendo banner gradiente e a foto do perfil -->
        <header class="card-header">
            <div class="avatar-container">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&h=150&fit=crop" alt="Foto de Mariana" class="avatar">
            </div>
        </header>

        <!-- Conteúdo do Card com Nome, Cargo e Biografia -->
        <section class="card-body">
            <h1 class="name">Ana Silva</h1>
            <p class="title">Desenvolvedora Front-End Senior</p>
            <p class="bio">Apaixonada por CSS moderno, animações fluidas e arquitetura de interfaces focada na usabilidade e acessibilidade.</p>
        </section>

        <!-- Rodapé com botões circulares interativos para Redes Sociais -->
        <footer class="card-footer">
            <a href="#" class="social-btn github" aria-label="Github">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="#" class="social-btn linkedin" aria-label="LinkedIn">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="#" class="social-btn twitter" aria-label="Twitter">
                <i class="fa-brands fa-twitter"></i>
            </a>
        </footer>

    </article>

</body>
</html>
